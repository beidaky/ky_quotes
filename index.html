<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考研倒计时 · 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Bebas+Neue&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a08;
      --surface: #111110;
      --border: #2a2a25;
      --gold: #c9a84c;
      --gold-dim: #7a6330;
      --text: #e8e4d8;
      --text-dim: #6b6860;
      --red: #c0392b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans SC', sans-serif;
      overflow-x: hidden;
    }

    /* ── noise texture overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 999; opacity: .5;
    }

    /* ── layout ── */
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ── header ── */
    header {
      padding: 3rem 0 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
    }

    .header-year {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 12vw, 8rem);
      line-height: 1;
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .header-label {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .header-title {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--text);
    }

    .header-sub {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
    }

    /* ── main content ── */
    main {
      padding: 3rem 0;
      display: flex;
      flex-direction: column;
      gap: 4rem;
    }

    /* ── countdown ── */
    .countdown-section {}

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .countdown-item {
      background: var(--surface);
      padding: 2rem 1rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .countdown-item::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .countdown-item:hover::after { transform: scaleX(1); }

    .countdown-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1;
      color: var(--gold);
      display: block;
      letter-spacing: 0.05em;
    }

    .countdown-unit {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      margin-top: 0.5rem;
      display: block;
    }

    .countdown-date {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
    }

    .countdown-date span {
      color: var(--gold);
    }

    /* ── quotes ── */
    .quotes-section {}

    .quote-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .quote-item {
      padding: 2rem 0;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: 1.5rem;
      align-items: start;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .quote-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .quote-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: var(--gold-dim);
      line-height: 1.8;
    }

    .quote-text {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.9;
      font-weight: 400;
      color: var(--text);
    }

    /* loading & error */
    .quotes-status {
      padding: 2rem 0;
      font-size: 0.85rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    /* ── footer ── */
    footer {
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-motto {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
    }

    .footer-dot {
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.6); }
    }

    /* ── responsive ── */
    @media (max-width: 500px) {
      .countdown-grid { grid-template-columns: repeat(2, 1fr); }
      header { flex-direction: column; gap: 0.5rem; }
    }
  </style>
</head>
<body>
<div class="page">

  <header>
    <div class="header-year">2027</div>
    <div class="header-label">
      <div class="header-title">考研倒计时</div>
      <div class="header-sub">GRADUATE ENTRANCE EXAMINATION · CLASS OF 2027</div>
    </div>
  </header>

  <main>

    <!-- Countdown -->
    <section class="countdown-section">
      <div class="section-label">· 距离考研还有</div>
      <div class="countdown-grid">
        <div class="countdown-item">
          <span class="countdown-num" id="cd-days">--</span>
          <span class="countdown-unit">天 · DAYS</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-num" id="cd-hours">--</span>
          <span class="countdown-unit">时 · HOURS</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-num" id="cd-mins">--</span>
          <span class="countdown-unit">分 · MINUTES</span>
        </div>
        <div class="countdown-item">
          <span class="countdown-num" id="cd-secs">--</span>
          <span class="countdown-unit">秒 · SECONDS</span>
        </div>
      </div>
      <div class="countdown-date">目标日期 &nbsp;·&nbsp; <span>2026年12月19日 00:00 北京时间</span></div>
    </section>

    <!-- Quotes -->
    <section class="quotes-section">
      <div class="section-label">· 信念语录</div>
      <div class="quote-list" id="quote-list">
        <div class="quotes-status" id="quotes-status">加载中…</div>
      </div>
    </section>

  </main>

  <footer>
    <div class="footer-motto">坚定信念 · 2027一战成硕</div>
    <div class="footer-dot"></div>
  </footer>

</div>

<script>
  // ── Countdown ──────────────────────────────────────────
  // 目标：2026年12月19日 00:00:00 北京时间（UTC+8）
  // UTC+8 的午夜 = UTC 时间前一天 16:00
  const TARGET = new Date('2026-12-18T16:00:00Z');

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    const diff = TARGET - now;
    if (diff <= 0) {
      document.getElementById('cd-days').textContent = '00';
      document.getElementById('cd-hours').textContent = '00';
      document.getElementById('cd-mins').textContent = '00';
      document.getElementById('cd-secs').textContent = '00';
      return;
    }
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000) / 60000);
    const secs  = Math.floor((diff % 60000) / 1000);
    document.getElementById('cd-days').textContent  = pad(days);
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-mins').textContent  = pad(mins);
    document.getElementById('cd-secs').textContent  = pad(secs);
  }

  tick();
  setInterval(tick, 1000);

  // ── Load Quotes from quotes.txt ────────────────────────
  async function loadQuotes() {
    const list   = document.getElementById('quote-list');
    const status = document.getElementById('quotes-status');

    try {
      // Add cache-busting so updates show immediately
      const res = await fetch('./quotes.txt?v=' + Date.now());
      if (!res.ok) throw new Error('无法读取 quotes.txt');
      const text = await res.text();

      // Parse: each non-empty line is one quote
      const lines = text.split('\n')
        .map(l => l.trim())
        .filter(l => l.length > 0 && !l.startsWith('#'));

      if (lines.length === 0) {
        status.textContent = 'quotes.txt 中暂无语录，请添加内容。';
        return;
      }

      status.remove();
      lines.forEach((line, i) => {
        const item = document.createElement('div');
        item.className = 'quote-item';
        item.style.transitionDelay = (i * 80) + 'ms';
        item.innerHTML = `
          <div class="quote-num">${String(i + 1).padStart(2, '0')}</div>
          <div class="quote-text">${escapeHtml(line)}</div>
        `;
        list.appendChild(item);

        // Intersection observer for scroll animation
        observer.observe(item);
      });

    } catch (e) {
      status.textContent = '⚠ 无法加载语录：' + e.message + '（请确保 quotes.txt 与 index.html 在同一目录）';
    }
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // scroll-triggered reveal
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.1 });

  loadQuotes();
</script>
</body>
</html>
